name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build:static
        env:
          # Outside the Lovable sandbox the node-server preset is used and the prerender
          # script turns the SSR output into a static index.html for GitHub Pages.
          NITRO_PRESET: node-server

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: dist/public
          retention-days: 7
