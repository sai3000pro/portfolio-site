name: Verify

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: scripts/seo.mjs derives each sitemap <lastmod> from the last
          # commit touching that route's sources. The default depth-1 shallow clone has
          # no such history, so every route would silently fall back to the build date —
          # exactly the "everything changed today" signal the per-route dates replaced.
          fetch-depth: 0

      # Pinned, not `latest`: an unpinned Bun silently defeats bunfig.toml's
      # `minimumReleaseAge` supply-chain guard for Bun itself, and lets the toolchain
      # drift out from under a green lockfile. Matches the local dev toolchain.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # `build:static` is `vite build && node scripts/prerender.mjs` — it shells out to
      # `node` explicitly, so without this the prerender (and therefore sitemap.xml,
      # robots.txt and every OG card) would run on whatever ambient Node the runner
      # image happens to ship. Pinned to the newest patch of the Node 22 "Jod" LTS line —
      # the same major the maintainer runs locally (v22.13.0) and the same major
      # `@types/node` targets, so runtime and types agree. Dependabot's github-actions
      # ecosystem does NOT bump this input, so bump it by hand when the LTS line moves.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      # Refreshes src/data/github-stats.json in the runner's working tree so the star and
      # language chips on the project cards are current as of THIS build, not as of the
      # last time someone remembered to run the script by hand. The result is deliberately
      # not committed back: the file in git is the fallback, and this step is the refresh.
      #
      # Placed after the checks and before the build because it mutates a file the build
      # reads — running it earlier would make `format:check` and `typecheck` grade fetched
      # data instead of the committed source.
      #
      # The script never fails the build: on a network error, a 403/429 rate-limit or a
      # 404 it warns, preserves the committed JSON and exits 0. That is why there is no
      # `continue-on-error` here — a non-zero exit would be a real bug worth failing on.
      # The token only raises the rate limit; the unauthenticated path works too.
      - name: Refresh GitHub repo stats
        run: bun run stats
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        run: bun run build:static
        env:
          # Outside the Lovable sandbox the node-server preset is used and the prerender
          # script turns the SSR output into a static index.html for GitHub Pages.
          NITRO_PRESET: node-server

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: dist/public
          retention-days: 7
