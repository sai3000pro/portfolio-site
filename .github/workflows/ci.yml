name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Built with GITHUB_REPOSITORY cleared so asset paths are root-relative (base: "/"),
      # matching how Lighthouse's local static server serves the site. The `verify` job's
      # build is deliberately different: it keeps GITHUB_REPOSITORY so assets are prefixed
      # with /<repo>/, which is required for the real GitHub Pages deployment.
      - name: Build (root-relative, for local Lighthouse audit)
        run: bun run build:static
        env:
          NITRO_PRESET: node-server
          GITHUB_REPOSITORY: ""

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
