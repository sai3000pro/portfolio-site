name: CI

# Pull requests only. Pushes to main/master are covered by deploy.yml, which runs the
# same `verify` + `lighthouse` jobs before it publishes — running this workflow on push
# too meant every merge did two full verify builds plus a third Lighthouse build, under
# two concurrency groups that could not coordinate with each other.
on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  lighthouse:
    needs: verify
    uses: ./.github/workflows/lighthouse.yml
